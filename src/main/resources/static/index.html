
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Airline Booking System</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

    <!-- JavaScript -->
    <script src="/app.js" defer></script>
</head>

<body>

<nav class="navbar navbar-dark airline-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            ✈ Airline Booking
        </a>
    </div>
</nav>

<header class="hero-section">
    <div class="container py-5">
        <h1 class="display-5 fw-bold">
            Welcome to Airline Booking
        </h1>

        <p class="lead">
            Search flights and explore destinations.
        </p>
    </div>
</header>

<main class="container">

    <section class="search-card shadow">

        <h2 class="h4 mb-4">Search Flights</h2>

        <form id="searchForm" class="row g-3">

            <div class="col-md-5">
                <label for="origin" class="form-label">
                    From
                </label>
                <input id="origin"
                       class="form-control"
                       value="DFW"
                       maxlength="3"
                       required>
            </div>

            <div class="col-md-5">
                <label for="destination"
                       class="form-label">
                    To
                </label>
                <input id="destination"
                       class="form-control"
                       value="JFK"
                       maxlength="3"
                       required>
            </div>

            <div class="col-md-2 d-grid align-items-end">
                <button type="submit"
                        id="searchButton"
                        class="btn btn-airline">
                    Search
                </button>
            </div>

        </form>

        <button id="allFlightsButton"
                class="btn btn-outline-secondary mt-3">
            Show All Flights
        </button>

    </section>

    <section class="my-5">

        <h2>Available Flights</h2>

        <div id="status"
             role="status"
             class="mb-3"></div>

        <div id="flightResults"
             class="row g-4"></div>

    </section>

</main>

<footer class="footer py-4 text-center">
    Airline Booking System — Educational Demo
</footer>

</body>
</html>
